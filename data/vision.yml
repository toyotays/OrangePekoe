# ビジョンは「現在地 → 目の前 → 次のフォーミュラ → 育てる未来 → 夢・継承」の順に管理します。
# milestones は表示順に自由に追加・編集できます。

- id: foundation
  code: "00"
  phase: Current foundation
  title: すでに持っている力
  timeframe: 現在地
  image: /vision/00-formula-practice.webp
  imageAlt: 白と赤のフォーミュラカーでサーキットを走る現在の練習風景
  statement: 現在はフォーミュラの練習を重ねている。ITで形にする技術、仲間と活動する土台と同じように、夢はゼロから始まるのではなく、すでにある経験の先に続いている。
  milestones:
    - label: Formula practice
      text: 今の練習車で走行経験を積み、操作、ライン、判断を一つずつ自分のものにする。
    - label: Technology
      text: 知的好奇心とIT技術を、人や社会の役に立つ形へ変える。
    - label: Community
      text: サーキット、食事、NPOで出会った仲間との信頼を育てる。

- id: next
  code: "01"
  phase: Next moves
  title: 目の前から変える
  timeframe: 今日〜数か月
  image: /vision/02-next.webp
  imageAlt: 筋力トレーニング、英国風カジュアル、ITの仕事、NPOの小さなチーム
  statement: すぐに始められることを、無理なく続く形にする。身体、装い、仕事、社会貢献のすべてで、小さな実感を積み重ねる。
  milestones:
    - label: Body
      text: 細マッチョを目指し、続けられる筋力トレーニングと健康習慣をつくる。
    - label: Style
      text: スーツだけでなく、ツイードやニットを使った英国風カジュアルを日常にする。
    - label: Work
      text: 好きなITの仕事から、継続的な価値と収入を生む仕組みを一つ育てる。
    - label: NPO
      text: 全国へ広げるための次の一歩を決め、若いメンバーが誰かを助ける機会を増やす。

- id: motorsport
  code: "02"
  phase: Racing ambition
  title: 次のフォーミュラへ
  timeframe: 数年の挑戦
  image: /vision/02-formula-future.webp
  imageAlt: 現在のヘルメットを受け継ぎ、Super FJとF4を目指して鈴鹿を走る未来像
  statement: 現在の練習を土台に、Super FJ、そしてF4も選択肢に入る技量・体力・環境を整える。速い車へ乗ることだけではなく、学び続けて安全に速くなる過程を楽しむ。
  milestones:
    - label: Skill
      text: 走行ごとの振り返りを重ね、再現性のある操作と安定したラップを身につける。
    - label: Fitness
      text: 細マッチョの身体づくりを、集中力と持久力を支えるドライバーの基礎へつなげる。
    - label: Team & budget
      text: 参戦機会、チーム、必要な費用を具体化し、挑戦を継続できる環境をつくる。
    - label: Destination
      text: Super FJまたはF4へステップアップし、自分の力で次のカテゴリーを走る。

- id: horizon
  code: "03"
  phase: Growing future
  title: 好きな人生を育てる
  timeframe: 数か月〜数年
  image: /vision/03-horizon.webp
  imageAlt: パートナーとの欧州旅行、ニュルブルクリンク、スポーツカー、広がるNPOとITの仕事
  statement: パートナーとの旅、走りたい車、選べる仕事、広がるNPO。憧れを予定と選択へ変え、人生の自由度を高めていく。
  milestones:
    - label: Drive
      text: ロードスター、エリーゼ、A110、M2、ケイマンGT4、ケータハム7から、その時の自分に合う一台ずつを現実にする。
    - label: Grand tour
      text: パートナーとイギリス、ドイツ、台湾、韓国、カナダ、フランスを旅し、ニュルブルクリンクを走る。
    - label: Financial freedom
      text: 月収200万円・年収3,000万円を実現し、好きなことを好きなだけ仕事にする。
    - label: Social impact
      text: NPOの活動を複数地域へ広げ、施設出身の若者が運営と支援の中心へ進む。

- id: legacy
  code: "04"
  phase: Dream & legacy
  title: 夢を、次の世代へ
  timeframe: 長期・継承
  image: /vision/04-legacy.webp
  imageAlt: 英国風の3台ガレージハウスと、次世代へ引き継がれる全国規模のNPO
  statement: 自分の人生を十分に楽しみ、その自由と経験を誰かの力へ変える。最後に残すのは所有物だけでなく、若い世代が自信を持って続けられる仕組み。
  milestones:
    - label: Home
      text: 郊外に英国風の家を持ち、3台を美しく収められるガレージで車と暮らす。
    - label: Wealth
      text: 資産1億円を築き、旅・車・NPOを無理なく支えられる静かな豊かさを持つ。
    - label: People
      text: パートナーと世界を旅し、仲間と食事やサーキットで笑える時間を大切にする。
    - label: Legacy
      text: NPOを全国へ広げ、施設出身の子どもたちへ組織をバトンタッチする。誰かを助けた経験が、本人の自信になる循環を残す。
